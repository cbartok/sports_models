name: Daily CBB Predictions (7 AM Pacific)

on:
  schedule:
    - cron: "13 14 * 1-4,11-12 *"
    - cron: "13 15 * 1-4,11-12 *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional override date (YYYY-MM-DD); leave blank for today (Pacific)"
        required: false
        default: ""

jobs:
  predict-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Check Pacific DST (immune to GitHub cron delays)
        id: tz_check
        run: |
          TZ_ABBR=$(TZ="America/Los_Angeles" date +%Z)
          SCHED="${{ github.event.schedule }}"
          echo "Pacific TZ: $TZ_ABBR | Schedule: $SCHED"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$TZ_ABBR" = "PST" ] && [ "$SCHED" = "0 15 * 1-4,11-12 *" ]; } || \
             { [ "$TZ_ABBR" = "PDT" ] && [ "$SCHED" = "0 14 * 1-4,11-12 *" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "College Basketball/requirements.txt"

      - name: Install dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: pip install -r "College Basketball/requirements.txt"

      - name: Run daily CBB predictions and upload to Google Sheets
        if: steps.tz_check.outputs.should_run == 'true'
        working-directory: "College Basketball"
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || '1HRsJE6S7BW4B36ZgkVVQu0ztCedESuVjT-Kf7--jGvU' }}
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python cbb_model_predictor.py --date "${{ github.event.inputs.target_date }}"
          else
            python cbb_model_predictor.py
          fi

      - name: Upload predictions CSV artifact
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: cbb-predictions-${{ github.run_id }}
          path: "College Basketball/cbb_predictions.csv"
          retention-days: 14

      - name: Publish updated predictions to GitHub Pages
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily CBB predictions ($(TZ='America/Los_Angeles' date +%Y-%m-%d))"
            git push
          else
            echo "No changes in docs/data/ to commit."
          fi
