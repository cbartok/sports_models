name: Daily CBB Predictions

on:
  schedule:
    # 5:13 AM PST / 6:13 AM PDT daily during CBB season (Nov-Apr)
    - cron: "13 13 * 1-4,11-12 *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional override date (YYYY-MM-DD); leave blank for today (Pacific)"
        required: false
        default: ""

jobs:
  predict-and-upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "College Basketball/requirements.txt"

      - name: Install dependencies
        run: pip install -r "College Basketball/requirements.txt"

      - name: Run daily CBB predictions
        working-directory: "College Basketball"
        env:
          CBBD_API_KEY: ${{ secrets.CBBD_API_KEY }}
          THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
          KENPOM_API_KEY: ${{ secrets.KENPOM_API_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python cbb_model_predictor.py --no-sheets --date "${{ github.event.inputs.target_date }}"
          else
            python cbb_model_predictor.py --no-sheets
          fi

      - name: Publish updated predictions to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update daily CBB predictions ($(TZ='America/Los_Angeles' date +%Y-%m-%d))"
            git pull --rebase origin master
            git push
          else
            echo "No changes in docs/data/latest.json to commit."
          fi
