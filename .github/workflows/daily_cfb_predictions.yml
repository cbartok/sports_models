name: Daily CFB Predictions (7 AM Pacific)

on:
  schedule:
    # Daily at 7:17 AM PDT (14:17 UTC) and 7:17 AM PST (15:17 UTC) during CFB season (Aug-Jan)
    - cron: "17 14 * 8-12,1 *"
    - cron: "17 15 * 8-12,1 *"
  workflow_dispatch:
    inputs:
      start_date:
        description: "Optional start date (YYYY-MM-DD); leave blank for today (Pacific)"
        required: false
        default: ""
      end_date:
        description: "Optional end date (YYYY-MM-DD); leave blank for start + 6 days"
        required: false
        default: ""

jobs:
  predict-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check Pacific DST (immune to GitHub cron delays)
        id: tz_check
        run: |
          TZ_ABBR=$(TZ="America/Los_Angeles" date +%Z)
          SCHED="${{ github.event.schedule }}"
          echo "Pacific TZ: $TZ_ABBR | Schedule: $SCHED"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$TZ_ABBR" = "PST" ] && [ "$SCHED" = "17 15 * 8-12,1 *" ]; } || \
             { [ "$TZ_ABBR" = "PDT" ] && [ "$SCHED" = "17 14 * 8-12,1 *" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "College Football/requirements.txt"

      - name: Install dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: pip install -r "College Football/requirements.txt"

      - name: Run daily CFB predictions (upcoming 7-day slate)
        if: steps.tz_check.outputs.should_run == 'true'
        working-directory: "College Football"
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
        run: |
          ARGS="--no-sheets"
          if [ -n "${{ github.event.inputs.start_date }}" ]; then
            ARGS="$ARGS --start-date ${{ github.event.inputs.start_date }}"
          fi
          if [ -n "${{ github.event.inputs.end_date }}" ]; then
            ARGS="$ARGS --end-date ${{ github.event.inputs.end_date }}"
          fi
          python cfb_model_predictor.py $ARGS

      - name: Publish updated CFB predictions to GitHub Pages
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin master
          git add docs/data/cfb/
          if ! git diff --cached --quiet; then
            git commit -m "Update daily CFB predictions ($(TZ='America/Los_Angeles' date +%Y-%m-%d))"
            git push
          else
            echo "No changes in docs/data/cfb/ to commit."
          fi
