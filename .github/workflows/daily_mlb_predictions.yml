name: Daily MLB Predictions (Every 30m, 7 AM - 7:30 PM PT)

on:
  schedule:
    # Every 30 min during 7:00 AM - 7:30 PM PT across MLB season (Mar-Oct)
    # Pacific hour window (7..19) is enforced below so both PST and PDT work cleanly.
    - cron: "5,35 14-23,0-3 * 3-10 *"
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional date (YYYY-MM-DD); leave blank for today (Pacific)"
        required: false
        default: ""

jobs:
  sync-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check Pacific active window (7 AM - 7:30 PM PT)
        id: tz_check
        run: |
          PT_HOUR=$(TZ="America/Los_Angeles" date +%-H)
          echo "Current Pacific hour: $PT_HOUR"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
             { [ "$PT_HOUR" -ge 7 ] && [ "$PT_HOUR" -le 19 ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        if: steps.tz_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: "MLB/requirements.txt"

      - name: Install dependencies
        if: steps.tz_check.outputs.should_run == 'true'
        run: pip install -r "MLB/requirements.txt"

      - name: Sync MLB slate (projected -> official -> locked) & refresh odds
        if: steps.tz_check.outputs.should_run == 'true'
        working-directory: "MLB"
        run: |
          if [ -n "${{ github.event.inputs.target_date }}" ]; then
            python mlb_daily_runner.py --date "${{ github.event.inputs.target_date }}"
          else
            python mlb_daily_runner.py
          fi

      - name: Publish updated MLB predictions to GitHub Pages
        if: steps.tz_check.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/mlb/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Update MLB predictions ($(TZ='America/Los_Angeles' date +'%Y-%m-%d %H:%M %Z'))"
            git pull --rebase origin master
            git push
          else
            echo "No changes in docs/data/mlb/latest.json to commit."
          fi
